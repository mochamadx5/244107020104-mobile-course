name: week6_auth_messaging
description: "Week 6 - Authentication and Messaging Project"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Routing & Auth Guard
  go_router: ^14.0.0

  # HTTP Client & REST API
  dio: ^5.4.0

  # Token Storage (Secure Storage / SharedPreferences)
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
